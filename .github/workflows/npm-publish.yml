name: OpenJob npm publication (disabled pending owner approval)
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
  actions: read
concurrency:
  group: openjob-npm-publication
  cancel-in-progress: false
jobs:
  build:
    # The variable does not exist. Do not create/set it until the owner approves exact persistent access.
    if: vars.OPENJOB_NPM_PUBLISHING_ENABLED == 'true' && github.repository == 'scwlkr/openjob' && (github.event_name == 'push' || (!github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:distribution
      - run: node --test tests/npm-publication.test.mjs
      - name: Build exact channel source
        env:
          CHANNEL: ${{ github.event_name == 'release' && 'latest' || 'dev' }}
        run: node scripts/build-npm-app.mjs "$CHANNEL"
      - name: Verify registry identity and seal artifact for review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-publication.mjs prepare dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: |
            dist/*.tgz
            dist/publication.json
          if-no-files-found: error
  publish:
    needs: build
    if: vars.OPENJOB_NPM_PUBLISHING_ENABLED == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Both environments must be created/protected by the owner before activation.
    # Release: v* tag restriction + required scwlkr approval, admin bypass disabled.
    environment: ${{ needs.build.outputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/publication
      - name: Publish the reviewed bytes once using OIDC, then read back integrity and tag
        env:
          GH_TOKEN: ${{ github.token }}
          OPENJOB_NPM_PUBLISHING_ENABLED: ${{ vars.OPENJOB_NPM_PUBLISHING_ENABLED }}
        run: node scripts/npm-publication.mjs publish dist/publication/publication.json
# No secrets, npm tokens, dist-tag write permission, release creation or deployment.

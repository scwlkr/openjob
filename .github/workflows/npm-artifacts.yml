name: OpenJob npm artifacts (manual only, no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:distribution
      - run: node scripts/build-npm-app.mjs local
      - run: npm pack ./dist/npm --pack-destination ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: openjob-installation-review-${{ github.sha }}
          path: dist/*.tgz
# Optional owner-requested artifact only. No push/release runs or publication.

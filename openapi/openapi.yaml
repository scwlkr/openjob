          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
        default:
          description: Redacted failure, including unconfigured503, denied403, conflict409
            or invalid400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/connections/{connectionId}/mail:
    parameters:
      - in: path
        name: connectionId
        required: true
        schema: *a1
    get:
      tags:
        - Providers
      operationId: readConnectionMail
      summary: readConnectionMail
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      description: Human-only simulated Connections contract. Normal runtime remains
        unconfigured (503). Explicit resource homes and read-only Mail; no real
        grant, provider Calendar, sending or credentials. Fixture must inject the
        application.
      responses:
        "200":
          description: Simulated application result; never live consent or provider traffic.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - mode
                      - workspaceId
                      - page
                    properties:
                      mode:
                        const: simulated
                      workspaceId:
                        type: string
                        pattern: ^wsp_[a-f0-9]{32}$
                      page:
                        type: object
                        additionalProperties: false
                        required:
                          - messages
                          - folders
                          - calendars
                          - events
                          - nextCursor
                          - syncCursor
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProviderPreviewMessage"
                          folders:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProviderPreviewFolder"
                          calendars:
                            type: array
                            maxItems: 0
                            items:
                              $ref: "#/components/schemas/ProviderPreviewCalendar"
                          events:
                            type: array
                            maxItems: 0
                            items:
                              $ref: "#/components/schemas/ProviderPreviewEvent"
                          nextCursor:
                            type:
                              - string
                              - "null"
                          syncCursor:
                            type:
                              - string
                              - "null"
              example:
                data:
                  mode: simulated
                  workspaceId: wsp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  page:
                    messages: []
                    folders: []
                    calendars: []
                    events: []
                    nextCursor: null
                    syncCursor: null
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
        default:
          description: Redacted failure, including unconfigured503, denied403, conflict409
            or invalid400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    personalWorkspaceAgentBearer:
      type: http
      scheme: bearer
      bearerFormat: OpenJobPersonalAgent
      description: Distinct oj_personal_<owner>.<grant>.<secret> credential. Only granted tasks/calendar/invented-Mail
        scopes and explicitly named personal/example-mailbox resources; expires after24hours, immediate
        revocation. Never refresh or fall back to a human identity.
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque scoped agent credential
      description: Fixed read-only access to one Task Group; no human identity or refresh fallback.
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: |
        Short-lived Firebase ID token sent as Authorization: Bearer <token>.
        The service verifies Firebase claims, permits only the Google and Apple
        sign-in providers, resolves a provider-scoped subject to one canonical
        User, and rechecks authorization on every request.
    deletionStatusBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque account-deletion status capability
      description: |
        Client-held capability prepared before account deletion starts. It
        authorizes status reads, contains no plaintext identity or content,
        never appears in a URL or log, and is removed by the client only after
        confirmed completion is acknowledged. When sent to OpenJob it appears only in GET
        Authorization or the destructive POST x-openjob-deletion-status binding
        header.

  headers:
    NoStore:
      description: Sensitive authentication and status responses are never cached.
      required: true
      schema:
        const: no-store

  parameters:
    InstallationId:
      name: installationId
      in: path
      required: true
      description: Opaque browser-installation identity generated and retained locally.
      schema:
        $ref: "#/components/schemas/InstallationId"
      example: installation_0123456789abcdef
    GroupId:
      name: groupId
      in: path
      required: true
      description: Immutable, opaque, never-reused Group ID.
      schema:
        $ref: "#/components/schemas/GroupId"
      example: grp_acme_ops
    TaskId:
      name: taskId
      in: path
      required: true
      description: Immutable, opaque Task ID.
      schema:
        $ref: "#/components/schemas/TaskId"
      example: task_ship_docs
    UserId:
      name: userId
      in: path
      required: true
      description: Canonical opaque OpenJob User ID.
      schema:
        $ref: "#/components/schemas/UserId"
      example: user_maya
    InviteToken:
      name: token
      in: path
      required: true
      description: Opaque Invite Link credential. It must never be logged.
      schema:
        type: string
        minLength: 1
      example: ivt_7R3mTn9pQ2vX8kL4sF6aB1cD5eG0hJ
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned as nextCursor.
      schema:
        $ref: "#/components/schemas/CursorToken"
      example: cur_01J0NEXT
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 100 and cannot exceed 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      example: 100
    TaskStatus:
      name: status
      in: query
      required: false
      description: Task state filter. The default view contains open Tasks.
      schema:
        type: string
        enum: [open, done, all]
        default: open
      example: open
    TaskAssignee:
      name: assignee
      in: query
      required: false
      description: |
        Omit for all assignee states. Pass unassigned for recovery work or an
        exact Username for one current or historical assignee.
      schema:
        anyOf:
          - const: unassigned
          - $ref: "#/components/schemas/Username"
      example: maya

  requestBodies:
    RegisterNotificationSubscriptionRequest:
      description: Bounded serialized browser Push subscription capability.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PushSubscriptionInput"
          example:
            endpoint: https://push.example.test/subscriptions/example-capability
            keys:
              p256dh: p256dh_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG
              auth: auth_0123456789abcdef
    SetNotificationSubscriptionStateRequest:
      description: Desired delivery state; pausing retains the browser capability.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotificationSubscriptionStateInput"
          example:
            state: paused
    CreateCurrentUserRequest:
      description: Explicit confirmation that an unknown Sign-in Method should create a User.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCurrentUserInput"
          example:
            confirmation: create
    LinkSignInMethodRequest:
      description: |
        Explicit link confirmation for the current Authorization session.
        credentialToken is the fresh additional-provider proof and is sensitive
        write-only data. expectedTargetUserId is the displayed surviving User.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LinkSignInMethodInput"
          example:
            confirmation: link
            credentialToken: fresh-firebase-id-token
            expectedTargetUserId: user_maya
    DeleteCurrentUserRequest:
      description: Explicit irreversible confirmation plus fresh proof for every linked provider.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeleteCurrentUserInput"
          example:
            confirmation: delete
            credentials:
              - credentialToken: fresh-firebase-id-token
                provider: google
                revocation:
                  kind: access_token
                  idToken: fresh-google-provider-id-token
                  value: fresh-provider-access-token
    RefreshAccountDeletionProviderRequest:
      description: One fresh proof for the exact pending provider slot.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshAccountDeletionProviderInput"
          example:
            credential:
              credentialToken: fresh-firebase-id-token
              provider: google
              revocation:
                idToken: fresh-google-provider-id-token
                kind: access_token
                value: fresh-provider-access-token
    RecoverAccountDeletionRequest:
      description: |
        Optional only for lost-receipt recovery after an exact
        account_deletion_pending response. It carries the Firebase ID token and
        raw provider revocation proof from the same fresh sign-in. Active-User
        status preparation omits the body.
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshAccountDeletionProviderInput"
          example:
            credential:
              credentialToken: fresh-firebase-id-token
              provider: google
              revocation:
                idToken: fresh-google-provider-id-token
                kind: access_token
                value: fresh-provider-access-token
    ClaimUsernameRequest:
      description: Immutable Username claim.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClaimUsernameInput"
          example:
            username: shane
    CreateGroupRequest:
      description: Required human-facing Group Name.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupNameInput"
          example:
            name: Acme Operations
    RenameGroupRequest:
      description: Replacement human-facing Group Name.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupNameInput"
          example:
            name: Acme Field Operations
    EndGroupRequest:
      description: Exact current Group Name used as destructive confirmation.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EndGroupInput"
          example:
            confirmationName: Acme Operations
    BanGroupUserRequest:
      description: Canonical User ID of a current or former Member.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BanGroupUserInput"
          example:
            userId: user_maya
    CreateTaskRequest:
      description: New Task fields. assigneeUsername must resolve to a current Member.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateTaskInput"
          example:
            text: |-
              Publish the v1 API contract
              Verify generated client types.
            assigneeUsername: maya
            priority: high
            dueDate: "2026-07-18"
    UpdateTaskRequest:
      description: One or more editable fields for an open Task.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateTaskInput"
          example:
            text: Publish and review the v1 API contract
            assigneeUsername: shane
            priority: low
            dueDate: null
    SetTaskStateRequest:
      description: Desired Task state; this is not a toggle.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SetTaskStateInput"
          example:
            state: done

  responses:
    NotificationSubscriptionResponse:
      description: Redacted installation state without Push capability data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotificationSubscriptionEnvelope"
          example:
            data:
              installationId: installation_0123456789abcdef
              state: active
    CurrentUserResponse:
      description: Authenticated User and accessible Groups.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CurrentUserEnvelope"
          example:
            data:
              userId: user_shane
              username: shane
              usernameRequired: false
              groups:
                - groupId: grp_acme_ops
                  name: Acme Operations
                  role: admin
                  createdAt: "2026-07-15T14:30:00Z"
    SignInMethodCollectionResponse:
      description: Safe provider labels linked to the canonical User.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignInMethodCollectionEnvelope"
          example:
            data: [apple, google]
    AccountDeletionCompletedResponse:
      description: Account deletion completed and no retry state remains.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDeletionCompletedEnvelope"
          example:
            data:
              completedAt: "2026-07-28T12:00:00Z"
              status: completed
    AccountDeletionPreparationResponse:
      description: |
        A fresh active-User status capability, or final confirmation after a
        recovery proof was synchronously revoked and its recreated Firebase
        identity was deleted.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AccountDeletionStatusTokenEnvelope"
              - $ref: "#/components/schemas/AccountDeletionCompletedEnvelope"
          examples:
            prepared:
              value:
                data:
                  status: not_started
                  statusToken: v1.AAAAAAAAAAAAAAAA.BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                  submissionExpiresAt: "2026-07-28T12:05:00Z"
            completedRecovery:
              value:
                data:
                  completedAt: "2026-07-28T12:00:00Z"
                  status: completed
    AccountDeletionPendingResponse:
      description: Access ended and deletion is retrying within seven days.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDeletionPendingEnvelope"
          example:
            data:
              deadline: "2026-08-04T12:00:00Z"
              reauthenticationProviders: []
              requestedAt: "2026-07-28T12:00:00Z"
              statusToken: v1.AAAAAAAAAAAAAAAA.BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              status: pending
    AccountDeletionStatusTokenResponse:
      description: |
        User-and-intent-bound status capability plus its five-minute destructive
        submission deadline.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDeletionStatusTokenEnvelope"
          example:
            data:
              status: not_started
              statusToken: v1.AAAAAAAAAAAAAAAA.BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              submissionExpiresAt: "2026-07-28T12:05:00Z"
    AccountDeletionStatusResponse:
      description: Fail-closed pending status or final deletion confirmation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDeletionStatusEnvelope"
          example:
            data:
              deadline: "2026-08-04T12:00:00Z"
              reauthenticationProviders: []
              requestedAt: "2026-07-28T12:00:00Z"
              status: pending
    AccountDeletionUnavailableResponse:
      description: |
        Deletion cannot safely start or its status cannot safely be resolved.
        This response never implies completion.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDeletionUnavailableErrorEnvelope"
          example:
            error:
              code: account_deletion_unavailable
              message: Account deletion is temporarily unavailable.
              requestId: req_delete_unavailable
    AccountDeletionRecoveryAuthenticationResponse:
      description: |
        The Firebase Bearer credential is missing or invalid, or pending
        recovery omitted a fresh same-provider proof bound to that credential.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LinkAuthenticationErrorEnvelope"
          examples:
            missingBearer:
              value:
                error:
                  code: authentication_required
                  message: Authentication is required.
                  requestId: req_delete_auth
            missingFreshProof:
              value:
                error:
                  code: fresh_authentication_required
                  message: Freshly authenticate the required Sign-in Method.
                  requestId: req_delete_fresh
    AccountDeletionAlreadyPendingResponse:
      description: Account deletion already started; recover status with PUT.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountDeletionPendingErrorEnvelope"
          example:
            error:
              code: account_deletion_pending
              message: Account deletion is pending.
              requestId: req_delete_pending
    GroupResponse:
      description: One Group in a single-resource success envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupEnvelope"
          example:
            data:
              groupId: grp_acme_ops
              name: Acme Operations
              role: admin
              createdAt: "2026-07-15T14:30:00Z"
    GroupCollectionResponse:
      description: Cursor-paginated accessible Groups.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupCollectionEnvelope"
          example:
            data:
              - groupId: grp_acme_ops
                name: Acme Operations
                role: admin
                createdAt: "2026-07-15T14:30:00Z"
            nextCursor: null
    MemberResponse:
      description: One current Group Member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemberEnvelope"
          example:
            data:
              userId: user_maya
              username: maya
              role: admin
              joinedAt: "2026-07-15T15:00:00Z"
    MemberCollectionResponse:
      description: Cursor-paginated current Group Members.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemberCollectionEnvelope"
          example:
            data:
              - userId: user_shane
                username: shane
                role: admin
                joinedAt: "2026-07-15T14:30:00Z"
              - userId: user_maya
                username: maya
                role: member
                joinedAt: "2026-07-15T15:00:00Z"
            nextCursor: null
    BanResponse:
      description: One Group-scoped ban.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BanEnvelope"
          example:
            data:
              userId: user_maya
              username: maya
              bannedAt: "2026-07-15T17:00:00Z"
    BanCollectionResponse:
      description: Cursor-paginated Group-scoped bans.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BanCollectionEnvelope"
          example:
            data:
              - userId: user_maya
                username: maya
                bannedAt: "2026-07-15T17:00:00Z"
            nextCursor: null
    InviteLinkResponse:
      description: Current Admin-only Invite Link.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InviteLinkEnvelope"
          example:
            data:
              token: ivt_7R3mTn9pQ2vX8kL4sF6aB1cD5eG0hJ
              url: https://openjob.dev/invites/ivt_7R3mTn9pQ2vX8kL4sF6aB1cD5eG0hJ
              issuedAt: "2026-07-15T14:30:00Z"
              expiresAt: "2026-07-22T14:30:00Z"
              remainingJoins: 25
    InvitePreviewResponse:
      description: Privacy-limited Invite Link preview.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvitePreviewEnvelope"
          example:
            data:
              groupName: Acme Operations
    TaskResponse:
      description: One Task in a single-resource success envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskEnvelope"
          example:
            data:
              taskId: task_ship_docs
              groupId: grp_acme_ops
              text: Publish the v1 API contract
              assignee:
                state: assigned
                userId: user_maya
                username: maya
              priority: high
              dueDate: "2026-07-18"
              state: open
              createdAt: "2026-07-15T16:00:00Z"
              completedAt: null
    TaskCollectionResponse:
      description: Filtered, stably ordered, cursor-paginated Tasks.
      headers:
        ETag:
          description: Opaque validator for Group-visible Task List state.
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskCollectionEnvelope"
          examples:
            assigned:
              summary: Open assigned Task
              value:
                data:
                  - taskId: task_ship_docs
                    groupId: grp_acme_ops
                    text: Publish the v1 API contract
                    assignee:
                      state: assigned
                      userId: user_maya
                      username: maya
                    priority: high
                    dueDate: "2026-07-18"
                    state: open
                    createdAt: "2026-07-15T16:00:00Z"
                    completedAt: null
                nextCursor: cur_01J0NEXT
            done:
              summary: Completed Task with historical assignee attribution
              value:
                data:
                  - taskId: task_review_contract
                    groupId: grp_acme_ops
                    text: Review the v1 API contract
                    assignee:
                      state: assigned
                      userId: user_maya
                      username: maya
                    priority: normal
                    dueDate: "2026-07-17"
                    state: done
                    createdAt: "2026-07-15T15:00:00Z"
                    completedAt: "2026-07-16T10:00:00Z"
                nextCursor: null
            unassigned:
              summary: Removal-induced Unassigned Task
              value:
                data:
                  - taskId: task_recover_work
                    groupId: grp_acme_ops
                    text: Reassign release checklist
                    assignee:
                      state: unassigned
                    priority: low
                    dueDate: null
                    state: open
                    createdAt: "2026-07-14T10:00:00Z"
                    completedAt: null
                nextCursor: null
    ValidationErrorResponse:
      description: Malformed JSON or field validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequestErrorEnvelope"
          example:
            error:
              code: invalid_request
              message: One or more fields are invalid.
              fields:
                name: Must contain 1 to 80 characters.
              requestId: req_01J0VALID
    UnauthorizedResponse:
      description: |
        The required Bearer credential is missing, malformed, expired, or
        invalid for this operation. Most operations require an allowed Google-
        or Apple-backed Firebase identity; deletion status requires its opaque
        device-held capability.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationErrorEnvelope"
          example:
            error:
              code: authentication_required
              message: Authentication is required.
              requestId: req_01J0AUTH
    LinkAuthenticationErrorResponse:
      description: |
        Either the request is unauthenticated or the additional credential is
        invalid, stale, or not freshly reauthenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LinkAuthenticationErrorEnvelope"
          example:
            error:
              code: fresh_authentication_required
              message: Authenticate the additional Sign-in Method again.
              requestId: req_01J0FRESH
    ForbiddenResponse:
      description: The resource is visible to the User, but the requested Admin operation is forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminRequiredErrorEnvelope"
          example:
            error:
              code: admin_required
              message: Group Admin access is required.
              requestId: req_01J0FORBID
    MembershipDeniedResponse:
      description: Membership is denied without disclosing Group ban details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MembershipDeniedErrorEnvelope"
          example:
            error:
              code: membership_denied
              message: Membership could not be granted.
              requestId: req_01J0DENY
    ConcealedGroupNotFoundResponse:
      description: |
        Group was not found or is inaccessible. The same response deliberately
        prevents discovery of private Groups.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupNotFoundErrorEnvelope"
          example:
            error:
              code: group_not_found
              message: Group was not found.
              requestId: req_01J0GROUP404
    NotificationSubscriptionNotFoundResponse:
      description: |
        Notification Subscription is missing or belongs to another User. The
        same response prevents installation-ownership discovery.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotificationSubscriptionNotFoundErrorEnvelope"
          example:
            error:
              code: notification_subscription_not_found
              message: Notification Subscription was not found.
              requestId: req_01J0NOTIFY404
    ConcealedGroupOrMemberNotFoundResponse:
      description: Group is inaccessible or the target is not a current Member; no private Group details are disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemberNotFoundErrorEnvelope"
          example:
            error:
              code: member_not_found
              message: Member was not found.
              requestId: req_01J0MEMBER404
    ConcealedGroupOrUserNotFoundResponse:
      description: Group is inaccessible or the User has never belonged to it; no private Group details are disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserNotFoundErrorEnvelope"
          example:
            error:
              code: user_not_found
              message: User was not found.
              requestId: req_01J0USER404
    ConcealedGroupOrBanNotFoundResponse:
      description: Group is inaccessible or no matching Group-scoped ban exists; no private Group details are disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BanNotFoundErrorEnvelope"
          example:
            error:
              code: ban_not_found
              message: Ban was not found.
              requestId: req_01J0BAN404
    ConcealedGroupOrTaskNotFoundResponse:
      description: Group is inaccessible or the Task does not exist; no private Group details are disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskNotFoundErrorEnvelope"
          example:
            error:
              code: task_not_found
              message: Task was not found.
              requestId: req_01J0TASK404
    InvalidInviteResponse:
      description: |
        Invite Link is unknown, expired, rotated, exhausted, or belongs to an
        ended Group. Every invalid state uses this same privacy-preserving result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InviteNotFoundErrorEnvelope"
          example:
            error:
              code: invite_not_found
              message: Invite Link is not valid.
              requestId: req_01J0INVITE404
    UsernameConflictResponse:
      description: Username is unavailable or the User already claimed a different one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UsernameConflictErrorEnvelope"
          example:
            error:
              code: username_taken
              message: That Username is unavailable.
              requestId: req_01J0USERNAME
    SignInMethodUnrecognizedResponse:
      description: |
        The credential is valid but is not linked to a User. The client must
        explicitly choose User creation or linking.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignInMethodUnrecognizedErrorEnvelope"
          example:
            error:
              code: sign_in_method_unrecognized
              message: Choose whether to create a new User or link an existing User.
              requestId: req_01J0METHOD
    LinkSignInMethodConflictResponse:
      description: |
        When neither credential identifies a User, the client receives
        sign_in_method_unrecognized and must explicitly choose creation or a
        different linking session. An occupied provider slot or an attempted
        merge of two historical Users returns sign_in_method_conflict. If the
        surviving User no longer matches expectedTargetUserId at commit,
        link_target_changed requires fresh authentication and confirmation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LinkSignInMethodConflictErrorEnvelope"
          example:
            error:
              code: sign_in_method_conflict
              message: That Sign-in Method cannot be linked.
              requestId: req_01J0LINK
    LeaveGroupConflictResponse:
      description: Leaving would abandon open work or remove the final Admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LeaveGroupConflictErrorEnvelope"
          example:
            error:
              code: open_tasks_assigned
              message: Reassign or complete open Tasks before leaving.
              requestId: req_01J0LEAVE
    EndGroupConflictResponse:
      description: Group ending is not confirmed or other Members remain.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EndGroupConflictErrorEnvelope"
          example:
            error:
              code: confirmation_mismatch
              message: The confirmation does not match the current Group Name.
              requestId: req_01J0END
    KickMemberConflictResponse:
      description: The target cannot be removed by this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KickMemberConflictErrorEnvelope"
          example:
            error:
              code: self_removal
              message: Use Leave Group to remove yourself.
              requestId: req_01J0KICK
    PromoteMemberConflictResponse:
      description: The target already has the requested role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromoteMemberConflictErrorEnvelope"
          example:
            error:
              code: member_role_conflict
              message: The Member is already an Admin.
              requestId: req_01J0PROMOTE
    DemoteMemberConflictResponse:
      description: The role change is invalid or would remove the final Admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DemoteMemberConflictErrorEnvelope"
          example:
            error:
              code: last_admin
              message: At least one Admin must remain.
              requestId: req_01J0DEMOTE
    BanUserConflictResponse:
      description: The target cannot be banned under the current Group state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BanUserConflictErrorEnvelope"
          example:
            error:
              code: ban_not_allowed
              message: That User cannot be banned.
              requestId: req_01J0BAN
    JoinGroupConflictResponse:
      description: The User must finish Username onboarding before joining.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JoinGroupConflictErrorEnvelope"
          example:
            error:
              code: username_required
              message: Claim a Username before joining a Group.
              requestId: req_01J0JOIN
    CreateTaskConflictResponse:
      description: The requested assignee is not a current Group Member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateTaskConflictErrorEnvelope"
          example:
            error:
              code: assignee_not_member
              message: Assign the Task to a current Member.
              requestId: req_01J0CREATE
    UpdateTaskConflictResponse:
      description: The Task or requested assignee conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateTaskConflictErrorEnvelope"
          example:
            error:
              code: task_done
              message: Reopen the Task before editing it.
              requestId: req_01J0UPDATE
    RateLimitedResponse:
      description: Infrastructure throttling. OpenJob defines no product-level quota in v1.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds to wait before another attempt, when known.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedErrorEnvelope"
          example:
            error:
              code: rate_limited
              message: Try again later.
              requestId: req_01J0RATE
    InternalErrorResponse:
      description: Unexpected service failure. The requestId can be used for support correlation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
          example:
            error:
              code: internal_error
              message: An unexpected error occurred.
              requestId: req_01J0INTERNAL

  schemas:
    ConnectionCatalog:
      type: object
      additionalProperties: false
      required:
        - mode
        - providers
        - choices
        - homes
        - bindings
      properties:
        mode:
          const: simulated
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - available
              - reason
            properties:
              id: &a1
                type: string
              available:
                type: boolean
              reason: *a1
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - label
              - provider
            properties:
              id: *a1
              label: *a1
              provider:
                const: gmail
        homes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - workspaceId
              - name
            properties:
              workspaceId: &a2
                type: string
                pattern: ^wsp_[a-f0-9]{32}$
              name: *a1
        bindings:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - workspaceId
              - choiceId
              - provider
              - status
            properties:
              id:
                type: string
                pattern: ^con_[a-f0-9]{32}$
              workspaceId: *a2
              choiceId: *a1
              provider:
                const: gmail
              status:
                enum:
                  - authorizing
                  - consent_required
                  - connected
                  - cancelled
                  - reconnect_required
                  - cleanup_pending
                  - disconnected
              address: *a1
    ConnectionBegin:
      type: object
      additionalProperties: false
      required:
        - choiceId
        - workspaceId
      properties:
        choiceId:
          type: string
          maxLength: 80
        workspaceId: *a2
    ConnectionAction:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          enum:
            - approve
            - cancel
            - disconnect
            - retry-cleanup
    ProviderConnectorStatus:
      oneOf:
        - $ref: "#/components/schemas/GmailConnectorStatus"
        - $ref: "#/components/schemas/OutlookConnectorStatus"
        - $ref: "#/components/schemas/ImapConnectorStatus"
    GmailConnectorStatus:
      type: object
      additionalProperties: false
      required:
        - provider
        - adapter
        - status
        - consent
        - liveExecutionEnabled
        - implementedOperations
        - unsupportedOperations
        - message
      properties:
        provider:
          type: string
          const: gmail
        adapter:
          type: string
          const: gmail-rest-read
        status:
          type: string
          const: not_connected
        consent:
          type: string
          const: required
        liveExecutionEnabled:
          type: boolean
          const: false
        implementedOperations:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - mail.read
              - mail.labels
        unsupportedOperations:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - calendar.read
              - calendar.write
              - mail.draft
              - mail.send
              - sync.history
              - reconnect
        message:
          type: string
          minLength: 1
          maxLength: 500
    OutlookConnectorStatus:
      type: object
      additionalProperties: false
      required:
        - provider
        - adapter
        - status
        - consent
        - liveExecutionEnabled
        - implementedOperations
        - unsupportedOperations
        - message
      properties:
        provider:
          type: string
          const: outlook
        adapter:
          type: string
          const: outlook-graph-read
        status:
          type: string
          const: not_connected
        consent:
          type: string
          const: required
        liveExecutionEnabled:
          type: boolean
          const: false
        implementedOperations:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - mail.read
              - mail.folders
        unsupportedOperations:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - calendar.read
              - calendar.write
              - mail.draft
              - mail.send
              - mail.delta
              - reconnect
        message:
          type: string
          minLength: 1
          maxLength: 500
    ImapConnectorStatus:
      type: object
      additionalProperties: false
      required:
        - provider
        - adapter
        - status
        - consent
        - liveExecutionEnabled
        - implementedOperations
        - unsupportedOperations
        - message
      properties:
        provider:
          type: string
          const: imap
        adapter:
          type: string
          const: imap-inbox-read
        status:
          type: string
          const: not_connected
        consent:
          type: string
          const: required
        liveExecutionEnabled:
          type: boolean
          const: false
        implementedOperations:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - mail.read
              - mail.inbox
        unsupportedOperations:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum:
              - calendar.read
              - calendar.write
              - mail.draft
              - mail.send
              - mail.delta
              - mail.threads
              - reconnect
        message:
          type: string
          minLength: 1
          maxLength: 500
    ProviderPreviewCapability:
      type: object
      additionalProperties: false
      required:
        - available
        - reason
      properties:
        available:
          type: boolean
        reason:
          type: string
    ProviderPreviewAccount:
      type: object
      additionalProperties: false
      required:

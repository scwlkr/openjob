      additionalProperties: false
      required: [credential]
      properties:
        credential:
          $ref: "#/components/schemas/AccountDeletionCredentialInput"
    AccountDeletionCompleted:
      type: object
      additionalProperties: false
      required: [completedAt, status]
      properties:
        completedAt:
          $ref: "#/components/schemas/Timestamp"
        status:
          const: completed
    AccountDeletionPending:
      type: object
      additionalProperties: false
      required: [deadline, reauthenticationProviders, requestedAt, status, statusToken]
      properties:
        deadline:
          $ref: "#/components/schemas/Timestamp"
        reauthenticationProviders:
          type: array
          uniqueItems: true
          items:
            enum: [apple, google]
        requestedAt:
          $ref: "#/components/schemas/Timestamp"
        status:
          const: pending
        statusToken:
          $ref: "#/components/schemas/AccountDeletionStatusToken"
    AccountDeletionStatusToken:
      type: string
      minLength: 32
      maxLength: 8192
      pattern: '^v1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      description: |
        Sensitive opaque status capability encrypted with an exact User and
        durable prepared-intent binding before deletion.
        The web client stores it in browser localStorage; native clients use
        platform secure storage. Never log it or put it in a URL. When sending it
        to OpenJob, use only GET or PATCH Authorization, or POST
        x-openjob-deletion-status.
    AccountDeletionStatusNotStarted:
      type: object
      additionalProperties: false
      required: [status, submissionExpired, submissionExpiresAt]
      properties:
        status:
          const: not_started
        submissionExpired:
          type: boolean
          description: |
            False while the exact prepared intent remains fresh and available
            for POST. True only after its submission deadline, when this status
            read removed the expired intent or observed it already absent. No
            later POST with an expired capability can create a deletion job.
        submissionExpiresAt:
          $ref: "#/components/schemas/Timestamp"
    AccountDeletionStatusCompleted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: completed
    AccountDeletionStatusPending:
      type: object
      additionalProperties: false
      required: [deadline, reauthenticationProviders, requestedAt, status]
      properties:
        deadline:
          $ref: "#/components/schemas/Timestamp"
        reauthenticationProviders:
          type: array
          uniqueItems: true
          items:
            enum: [apple, google]
        requestedAt:
          $ref: "#/components/schemas/Timestamp"
        status:
          const: pending
    AccountDeletionStatus:
      oneOf:
        - $ref: "#/components/schemas/AccountDeletionStatusNotStarted"
        - $ref: "#/components/schemas/AccountDeletionStatusCompleted"
        - $ref: "#/components/schemas/AccountDeletionStatusPending"
    AccountDeletionCompletedEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccountDeletionCompleted"
    AccountDeletionPendingEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccountDeletionPending"
    AccountDeletionStatusTokenEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, statusToken, submissionExpiresAt]
          properties:
            status:
              const: not_started
            statusToken:
              $ref: "#/components/schemas/AccountDeletionStatusToken"
            submissionExpiresAt:
              $ref: "#/components/schemas/Timestamp"
    AccountDeletionStatusEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccountDeletionStatus"

    PushSubscriptionKeysInput:
      type: object
      additionalProperties: false
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        auth:
          type: string
          minLength: 16
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeysInput"

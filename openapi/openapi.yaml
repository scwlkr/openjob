        - assignee
        - priority
        - dueDate
        - state
        - createdAt
        - completedAt
      properties:
        taskId:
          $ref: "#/components/schemas/TaskId"
        groupId:
          $ref: "#/components/schemas/GroupId"
        text:
          $ref: "#/components/schemas/TaskText"
        assignee:
          $ref: "#/components/schemas/Assignee"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        scheduledSlot:
          description: Omitted when unscheduled. Send null in a mutation to clear.
          $ref: "#/components/schemas/ScheduledSlot"
        dueDate:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        state:
          $ref: "#/components/schemas/TaskState"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        completedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      oneOf:
        - properties:
            state:
              const: open
            completedAt:
              type: "null"
        - properties:
            state:
              const: done
            completedAt:
              $ref: "#/components/schemas/Timestamp"

    InstallationId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque installation identifier with no User information.
    UserId:
      type: string
      minLength: 1
      description: Canonical opaque OpenJob User ID independent of provider subjects.
    GroupId:
      type: string
      minLength: 1
      description: Immutable, opaque, never-reused Group ID.
    TaskId:
      type: string
      minLength: 1
      description: Immutable opaque Task ID.
    CursorToken:
      type: string
      minLength: 1
      description: Opaque continuation token with no client-visible ordering semantics.
    UsernameSyntax:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9](?:[a-z0-9._-]{0,30}[a-z0-9])$'
      description: Syntactically valid lowercase Username text.
    Username:
      allOf:
        - $ref: "#/components/schemas/UsernameSyntax"
        - not:
            enum: [admin, support, openjob, unassigned, me]
      description: |
        Immutable lowercase Username. Period, underscore, and hyphen are allowed
        only internally. admin, support, openjob, unassigned, and me are reserved.
    GroupName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^(?=[\s\S]*\S)[^\u0000-\u001F\u007F-\u009F\u2028-\u2029\r\n]+$'
      description: |
        Trimmed Unicode label whose case and spelling are preserved. Names are
        not globally unique and are never URL handles.
    Date:
      type: string
      format: date
      description: Valid YYYY-MM-DD calendar date without a time or time zone.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp representing a UTC instant.
    TaskText:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: '^(?=[\s\S]*\S)(?![\s\S]*[\u0000-\u0009\u000B\u000C\u000E-\u001F\u007F-\u009F])[\s\S]+$'
      description: |
        UTF-8 multiline plain text, trimmed only at the outer edges. Internal
        line breaks and blank lines remain; line endings are normalized and
        other control characters are rejected.
    Role:
      type: string
      enum: [member, admin]
    TaskState:
      type: string
      enum: [open, done]
    TaskPriority:
      type: string
      enum: [high, normal, low]
      default: normal
    NotificationSubscriptionState:
      type: string
      enum: [active, paused]
    SignInProvider:
      type: string
      enum: [apple, google]
      description: Safe public label for an allowed Firebase Sign-in Method.

    CreateCurrentUserInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          const: create
    LinkSignInMethodInput:
      type: object
      additionalProperties: false
      required: [confirmation, credentialToken, expectedTargetUserId]
      properties:
        confirmation:
          const: link
        credentialToken:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
          description: |
            Fresh Firebase ID token for the additional Sign-in Method. Sensitive:
            never log, persist, place in a URL, or return this value.
        expectedTargetUserId:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: |
            User ID displayed during explicit confirmation. The atomic link is
            rejected if the resolved surviving User changed before commit.

        - conflict
        - agent_access_denied
        - not_found
        - invalid_request
        - authentication_required
        - fresh_authentication_required
        - account_deletion_pending
        - account_deletion_unavailable
        - sign_in_method_unrecognized
        - sign_in_method_conflict
        - link_target_changed
        - admin_required
        - membership_denied
        - group_not_found
        - member_not_found

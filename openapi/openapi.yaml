                  requestId: req_fixture
        "200":
          $ref: "#/components/responses/TaskResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupOrTaskNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/agent-grants:
    get:
      tags:
        - Agents
      summary: List only the signed-in owner’s agent grants
      operationId: listAgentGrants
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      responses:
        "200":
          description: Successful owner operation. Responses are never cached.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items: &a1
                      type: object
                      additionalProperties: false
                      required:
                        - agentId
                        - ownerUserId
                        - groupId
                        - name
                        - scope
                        - createdAt
                        - expiresAt
                      properties:
                        agentId:
                          type: string
                        ownerUserId:
                          type: string
                        groupId:
                          type: string
                        name:
                          type: string
                        scope:
                          type: string
                          const: tasks:read
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
              example:
                data:
                  - &a2
                    agentId: agt_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    ownerUserId: user_fixture
                    groupId: grp_fixture
                    name: Planning assistant
                    scope: tasks:read
                    createdAt: 2026-10-15T12:00:00.000Z
                    expiresAt: 2026-10-16T12:00:00.000Z
        "401": &a3
          $ref: "#/components/responses/UnauthorizedResponse"
        "409": &a4
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410": &a5
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429": &a6
          $ref: "#/components/responses/RateLimitedResponse"
        "500": &a7
          $ref: "#/components/responses/InternalErrorResponse"
    post:
      tags:
        - Agents
      summary: Issue one revocable 24-hour Task Group read credential
      operationId: createAgentGrant
      x-openjob-authorization: authenticated
      x-openjob-retryable: false
      responses:
        "201":
          description: Successful owner operation. Responses are never cached.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - agent
                      - token
                    properties:
                      agent: *a1
                      token:
                        type: string
              example:
                data:
                  agent: *a2
                  token: oj_agent_agt_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401": *a3
        "404": &a8
          description: Resource unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: not_found
                  message: The requested resource was not found.
                  requestId: req_fixture
        "409": *a4
        "410": *a5
        "429": *a6
        "500": *a7
      description: Human Firebase authentication only. Requires current Group
        membership with a membership generation. Fixed tasks:read scope, one
        Group, 24-hour lifetime. Token is returned once; only its hash is stored.
        Owner membership loss, rejoin, account deletion, expiry or explicit
        revocation deny subsequent reads. No Mail, Calendar, writes or
        administration access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - groupId
                - name
              properties:
                groupId:
                  $ref: "#/components/schemas/GroupId"
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
            example:
              groupId: grp_fixture
              name: Planning assistant
  /api/v1/agent-grants/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          pattern: ^agt_[a-f0-9]{32}$
    delete:
      tags:
        - Agents
      summary: Revoke only the signed-in owner’s grant
      operationId: revokeAgentGrant
      x-openjob-authorization: authenticated
      x-openjob-retryable: false
      responses:
        "204":
          description: Revoked. No response body.
        "401": *a3
        "404": *a8
        "409": *a4
        "410": *a5
        "429": *a6
        "500": *a7

  /api/v1/workspace/snapshot:
    get:
      tags:
        - Workspace
      operationId: getPersonalWorkspace
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      description: Authenticated personal Tasks, Calendar and explicitly invented Mail examples. Human
        Firebase sessions use the resolved User; personal agent credentials require current stored
        scopes and named example-mailbox resources with immediate revocation. No human credential fallback.
        Only humans may add idempotent mail examples. Invented drafts and Simulated Sent never reach a
        provider; mail.send always403sending_disabled. Real provider-preview messages and credential
        data cannot be imported. Fixture headers and Group credentials never authorize this API.
      responses:
        "200":
          description: Personal workspace result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PersonalWorkspaceView"
              example:
                data:
                  accounts: []
                  messages: []
                  tasks:
                    - id: task_personal
                      ownerId: user_personal
                      title: Prepare the demo
                      completed: false
                  calendars:
                    - id: personal
                      ownerId: user_personal
                      name: Personal
                      color: "#2454dc"
                  events: []
                  drafts: []
                  sent: []
                  agents: []
                  activity: []
        "400":
          description: Invalid bounded JSON command or fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Resource, command, agent identity or Origin denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Route unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Sign-in Method unrecognized or workspace changed concurrently; reload before retrying.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - sign_in_method_unrecognized
                              - conflict
              example:
                error:
                  code: conflict
                  message: The workspace changed. Reload before retrying.
                  requestId: req_personal_conflict
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "413":
          description: Request or workspace capacity exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Content type must be application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
      security:
        - firebaseBearer: []
        - personalWorkspaceAgentBearer: []
  /api/v1/workspace/commands:
    post:
      tags:
        - Workspace
      operationId: commandPersonalWorkspace
      x-openjob-authorization: authenticated
      x-openjob-retryable: false
      description: Authenticated personal Tasks, Calendar and explicitly invented Mail examples. Human

          maxLength: 3072
        accountId:
          type: string
          minLength: 1
          maxLength: 128
        upstreamId:
          type: string
          minLength: 1
          maxLength: 256
        threadId:
          type: string
          minLength: 1
          maxLength: 3072
        folderIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 3072
        subject:

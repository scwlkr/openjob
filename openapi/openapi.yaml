          minLength: 1
          maxLength: 128
        upstreamId:
          type: string
          minLength: 1
          maxLength: 256
        calendarId:
          type: string
          minLength: 1
          maxLength: 3072
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string

              example:
                error:
                  code: agent_access_denied
                  message: Agent access is denied.
                  requestId: req_fixture
        "200":
          $ref: "#/components/responses/TaskResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupOrTaskNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    patch:
      tags: [Tasks]
      summary: Edit an open Task
      description: |
        Updates any supplied text, priority, dueDate, scheduledSlot, or assigneeUsername field using
        last-accepted-write behavior. null clears dueDate or scheduledSlot. Assignees cannot be
        cleared manually, and done Tasks return task_done until reopened.
      operationId: updateGroupTask
      x-openjob-authorization: member

openapi: 3.1.0
info:
  title: OpenJob API
  version: 0.3.7
  summary: Shared backend contract for equal web and CLI clients
  description: |
    OpenJob exposes one versioned JSON API. Firebase Authentication issues human
    identities; owner-issued agent credentials permit scoped Task reads only.
    Every request is authorized against current service state. The web and CLI are presentation clients; validation, authorization,
    ordering, privacy, and domain transitions live in this service.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://openjob.dev
    description: Hosted OpenJob service
tags:
  - name: Identity
  - name: Notifications
  - name: Groups
  - name: Membership
  - name: Invite Links
  - name: Tasks
  - name: Agents
  - name: Workspace
  - name: Providers
security:
  - firebaseBearer: []
paths:
  /api/v1/me:
    get:
      tags: [Identity]
      summary: Get the current User
      description: |
        Returns the authenticated User and their accessible Groups. A User who
        has not completed onboarding has a null username and usernameRequired
        set to true. Provider identity details are never exposed. An unknown
        Sign-in Method is never allowed to create a User implicitly.
      operationId: getMe
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      responses:
        "200":
          $ref: "#/components/responses/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    post:
      tags: [Identity]
      summary: Explicitly create the current User
      description: |
        Creates a User only after the client explicitly confirms creation.
        Repeating the request for an already recognized Sign-in Method returns
        the same canonical User without changing Username or Group history.
        The allowlisted Preview QA password credential cannot create a User and
        remains sign_in_method_unrecognized until its permanent operator-owned
        binding is restored.
      operationId: createCurrentUser
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/CreateCurrentUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/CurrentUserResponse"
        "201":
          $ref: "#/components/responses/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/me/sign-in-methods:
    get:
      tags: [Identity]
      summary: List the current User's Sign-in Methods
      description: |
        Returns only the safe provider labels apple and google. Provider
        subjects, email addresses, profile data, and credential tokens are
        never returned.
      operationId: listSignInMethods
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      responses:
        "200":
          $ref: "#/components/responses/SignInMethodCollectionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    post:
      tags: [Identity]
      summary: Explicitly link an additional Sign-in Method
      description: |
        Links Google and Apple only after explicit confirmation with a freshly
        authenticated second credential. The request may add an unknown
        provider, confirm an already-linked pair, or remap only a proven empty
        onboarding shell. It never merges two Users with history. Email and
        profile similarity are never used.
        Authorization always carries the current primary session, including an
        unrecognized session in the Link existing flow. credentialToken always
        carries the freshly authenticated additional provider proof, and
        expectedTargetUserId binds the confirmation to the displayed surviving
        User. Credential tokens are never logged, placed in a URL, persisted, or
        returned.
      operationId: linkSignInMethod
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/LinkSignInMethodRequest"
      responses:
        "200":
          $ref: "#/components/responses/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/LinkAuthenticationErrorResponse"
        "409":
          $ref: "#/components/responses/LinkSignInMethodConflictResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/me/deletion:
    get:
      tags: [Identity]
      summary: Read account-deletion status
      description: |
        Uses the opaque status capability prepared before deletion. The capability
        is accepted only in the Authorization header and is never placed in a
        URL, logged, or echoed. For the exact active User and a fresh prepared
        intent, this operation is read-only and returns not_started with
        submissionExpired false, so a racing POST can still consume the intent.
        At or after submissionExpiresAt, this operation atomically removes the
        expired intent and returns submissionExpired true.
        Pending requires an exact matching deletion job and deletion-blocked
        User. Completed requires the User, job, and prepared intent all to be
        absent. Ambiguous or inconsistent state fails closed.
      operationId: getAccountDeletionStatus
      security:
        - deletionStatusBearer: []
      x-openjob-authorization: capability
      x-openjob-retryable: true
      responses:
        "200":
          $ref: "#/components/responses/AccountDeletionStatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
        "503":
          $ref: "#/components/responses/AccountDeletionUnavailableResponse"
    patch:
      tags: [Identity]
      summary: Refresh one unusable provider proof for a pending deletion
      description: |
        Uses only the opaque deletion status capability. The fresh Firebase and
        provider proof must match one exact encrypted, incomplete provider slot
        already marked as requiring reauthentication. The replacement is
        encrypted atomically, never restores OpenJob access, and resumes the
        same deletion job. Provider credentials and subjects are never returned
        or logged.
      operationId: refreshAccountDeletionProvider
      security:
        - deletionStatusBearer: []
      x-openjob-authorization: capability
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/RefreshAccountDeletionProviderRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountDeletionCompletedResponse"
        "202":
          $ref: "#/components/responses/AccountDeletionPendingResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/LinkAuthenticationErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
        "503":
          $ref: "#/components/responses/AccountDeletionUnavailableResponse"
    put:
      tags: [Identity]
      summary: Prepare an account-deletion status capability
      description: |
        Without a request body, authenticates an active User and creates or reuses
        one minimal durable prepared intent. The encrypted capability binds that
        User and exact intent and is accepted for a destructive POST until
        submissionExpiresAt, five minutes after preparation.

        After an exact account_deletion_pending response, the client instead sends
        the fresh Firebase and provider proof from that same sign-in. The proof
        must match the authenticated Firebase UID, provider, and upstream subject.
        OpenJob atomically reopens that provider under a successor processing
        lease, stores the encrypted proof, reruns Firebase-session and provider
        revocation, and returns a pending capability for durable client storage.
        If finalization already won, OpenJob still revokes the fresh authorization
        and deletes the recreated Firebase identity before returning completed.
        A Firebase-only restored session cannot recover a lost receipt.
      operationId: mintAccountDeletionStatusToken
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/RecoverAccountDeletionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountDeletionPreparationResponse"
        "202":
          $ref: "#/components/responses/AccountDeletionPendingResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/AccountDeletionRecoveryAuthenticationResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
        "503":
          $ref: "#/components/responses/AccountDeletionUnavailableResponse"
    post:
      tags: [Identity]
      summary: Permanently delete the current User and associated data
      description: |
        Starts one idempotent deletion after explicit irreversible confirmation
        and fresh authentication of every linked Sign-in Method. OpenJob access
        ends atomically when the encrypted retry job is created. A completed
        response means provider authorizations, Firebase identities, User and
        Username indexes, notifications, Group access, User-created Tasks, and
        personal attribution were removed. A pending response means access has
        ended but provider or infrastructure cleanup will retry for no more than
        seven calendar days. Clients prepare and persist the status capability
        with PUT, then send that exact capability in x-openjob-deletion-status.
        The atomic start consumes the exact unexpired prepared intent while it
        creates the deletion job and blocks the User. A pending response echoes
        the exact prepared capability. Already-pending Users are rejected before
        any fresh provider authentication. Credential and revocation values are
        never logged, returned, or retained after completion.
      operationId: deleteCurrentUser
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      parameters:
        - name: x-openjob-deletion-status
          in: header
          required: true
          description: |
            The exact capability returned by PUT and already persisted by the
            client. It must bind to this User and exact prepared intent and be
            submitted before submissionExpiresAt.
          schema:
            $ref: "#/components/schemas/AccountDeletionStatusToken"
      requestBody:
        $ref: "#/components/requestBodies/DeleteCurrentUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountDeletionCompletedResponse"
        "202":
          $ref: "#/components/responses/AccountDeletionPendingResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/LinkAuthenticationErrorResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
        "503":
          $ref: "#/components/responses/AccountDeletionUnavailableResponse"

  /api/v1/me/username:
    put:
      tags: [Identity]
      summary: Claim the current User's immutable Username
      description: |
        Claims one globally unique Username. Repeating the same claim succeeds
        idempotently. A different claim after success returns
        username_immutable; occupied or reserved values return a conflict.
      operationId: claimUsername
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/ClaimUsernameRequest"
      responses:
        "200":
          $ref: "#/components/responses/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/UsernameConflictResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/me/notification-subscriptions/{installationId}:
    parameters:
      - $ref: "#/components/parameters/InstallationId"
    get:
      tags: [Notifications]
      summary: Read this installation's Notification Subscription state
      description: |
        Returns only active or paused state when this installation belongs to
        the authenticated User. Push endpoint and encryption-key capabilities
        are never returned. Missing and differently owned installations use the
        same concealed response.
      operationId: getNotificationSubscription
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      responses:
        "200":
          $ref: "#/components/responses/NotificationSubscriptionResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotificationSubscriptionNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    put:
      tags: [Notifications]
      summary: Register or refresh this installation's Notification Subscription
      description: |
        Registers one bounded browser Push capability, makes delivery active,
        and associates the opaque installation with the authenticated User. An
        explicit PUT may reassign an installation from a previous User. The
        response never echoes endpoint or encryption-key capability data.
      operationId: registerNotificationSubscription
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/RegisterNotificationSubscriptionRequest"
      responses:
        "200":
          $ref: "#/components/responses/NotificationSubscriptionResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    patch:
      tags: [Notifications]
      summary: Activate or pause this installation's Notification Subscription
      description: |
        Changes delivery state for an installation already owned by the current
        User. Pausing retains the browser Push capability and permission.
      operationId: setNotificationSubscriptionState
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      requestBody:
        $ref: "#/components/requestBodies/SetNotificationSubscriptionStateRequest"
      responses:
        "200":
          $ref: "#/components/responses/NotificationSubscriptionResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotificationSubscriptionNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups:
    get:
      tags: [Groups]
      summary: List the current User's Groups
      description: Lists only Groups currently accessible to the authenticated User.
      operationId: listGroups
      x-openjob-authorization: authenticated
      x-openjob-retryable: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/GroupCollectionResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    post:
      tags: [Groups]
      summary: Create a Group
      description: |
        Creates a Group and atomically makes the authenticated User its first
        Member and Admin. Group creation is not safe for automatic retry.
      operationId: createGroup
      x-openjob-authorization: authenticated
      x-openjob-retryable: false
      requestBody:
        $ref: "#/components/requestBodies/CreateGroupRequest"
      responses:
        "201":
          $ref: "#/components/responses/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: Get an accessible Group
      description: |
        Returns the Group to a current Member. Unknown Groups and Groups that
        the User cannot access return the same concealed 404 response.
      operationId: getGroup
      x-openjob-authorization: member
      x-openjob-retryable: true
      responses:
        "200":
          $ref: "#/components/responses/GroupResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
    patch:
      tags: [Groups]
      summary: Rename a Group
      description: |
        Renames the Group without changing its ID. A known Member who is not an
        Admin receives 403; inaccessible and unknown Groups remain concealed.
      operationId: renameGroup
      x-openjob-authorization: admin
      x-openjob-retryable: false
      requestBody:
        $ref: "#/components/requestBodies/RenameGroupRequest"
      responses:
        "200":
          $ref: "#/components/responses/GroupResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}/actions/leave:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Groups]
      summary: Leave a Group
      description: |
        Removes the current User's membership immediately. The transition
        returns open_tasks_assigned while they own open Tasks and last_admin
        when it would leave an active Group without an Admin.
      operationId: leaveGroup
      x-openjob-authorization: member
      x-openjob-retryable: false
      responses:
        "204":
          description: Membership removed; no response body.
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupNotFoundResponse"
        "409":
          $ref: "#/components/responses/LeaveGroupConflictResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}/actions/end:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Groups]
      summary: Permanently end a Group
      description: |
        Permanently removes a Group and all Group-scoped data. Only an Admin who
        is the sole remaining Member may do this. The submitted current name is
        checked exactly; a mismatch returns confirmation_mismatch.
      operationId: endGroup
      x-openjob-authorization: admin
      x-openjob-retryable: false
      requestBody:
        $ref: "#/components/requestBodies/EndGroupRequest"
      responses:
        "204":
          description: Group permanently ended; no response body.
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupNotFoundResponse"
        "409":
          $ref: "#/components/responses/EndGroupConflictResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Membership]
      summary: List current Group Members
      description: |
        Lists current Members and their Member or Admin role. Any current Member
        may read the roster; inaccessible Groups use the concealed 404.
      operationId: listGroupMembers
      x-openjob-authorization: member
      x-openjob-retryable: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/MemberCollectionResponse"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupNotFoundResponse"
        "409":
          $ref: "#/components/responses/SignInMethodUnrecognizedResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}/members/{userId}/actions/kick:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Membership]
      summary: Kick a current Member
      description: |
        Removes another Member without banning them. Open Tasks assigned to the
        removed User become Unassigned atomically; done Tasks retain attribution.
        Self-kick and removal of the final Admin are conflicts.
      operationId: kickGroupMember
      x-openjob-authorization: admin
      x-openjob-retryable: false
      responses:
        "204":
          description: Member removed; no response body.
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupOrMemberNotFoundResponse"
        "409":
          $ref: "#/components/responses/KickMemberConflictResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}/members/{userId}/actions/promote:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Membership]
      summary: Promote a Member to Admin
      description: |
        Atomically verifies the actor's Admin role and the target's current
        membership, then grants the Admin role.
      operationId: promoteGroupMember
      x-openjob-authorization: admin
      x-openjob-retryable: false
      responses:
        "200":
          $ref: "#/components/responses/MemberResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/ConcealedGroupOrMemberNotFoundResponse"
        "409":
          $ref: "#/components/responses/PromoteMemberConflictResponse"
        "410":
          $ref: "#/components/responses/AccountDeletionAlreadyPendingResponse"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/v1/groups/{groupId}/members/{userId}/actions/demote:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Membership]
      summary: Demote an Admin to Member
      description: |
        Demotes the target, including the actor when requested, only when at
        least one Admin remains. last_admin identifies the protected conflict.
      operationId: demoteGroupMember
      x-openjob-authorization: admin
      x-openjob-retryable: false
      responses:
        "200":
          $ref: "#/components/responses/MemberResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":

    AssignedAssignee:
      type: object
      additionalProperties: false
      required: [state, userId, username]
      properties:
        state:
          const: assigned
        userId:
          $ref: "#/components/schemas/UserId"
        username:
          $ref: "#/components/schemas/Username"
    UnassignedAssignee:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          const: unassigned
    DeletedAssignee:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          const: deleted
    Assignee:
      description: |
        Assigned preserves canonical User identity and human attribution.
        Unassigned is a state caused only by forced Member removal, never a User.
        Deleted marks a completed Task whose former assignee identity was erased.
      oneOf:
        - $ref: "#/components/schemas/AssignedAssignee"
        - $ref: "#/components/schemas/UnassignedAssignee"
        - $ref: "#/components/schemas/DeletedAssignee"
      discriminator:
        propertyName: state
        mapping:
          assigned: "#/components/schemas/AssignedAssignee"
          unassigned: "#/components/schemas/UnassignedAssignee"
          deleted: "#/components/schemas/DeletedAssignee"

